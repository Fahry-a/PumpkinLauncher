name: Auto Build Pumpkin + Android APK

run-name: >-
  Pumpkin ${{ inputs.pumpkin_ref || 'latest release' }} → Android APK

on:
  workflow_dispatch:
    inputs:
      pumpkin_ref:
        description: "Optional Pumpkin tag, branch, or commit SHA (blank = latest GitHub release)"
        required: false
        type: string
  schedule:
    - cron: "0 2 * * *"
  push:
    branches: [master]
    paths:
      - ".github/workflows/auto-build-pumpkin-apk.yml"
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"

permissions:
  contents: read

concurrency:
  group: pumpkin-android-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-pumpkin:
    name: Cross-compile Pumpkin for Android
    runs-on: ubuntu-24.04
    outputs:
      pumpkin_ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - name: Checkout launcher
        uses: actions/checkout@v4

      - name: Resolve Pumpkin source ref
        id: resolve
        env:
          REQUESTED_REF: ${{ inputs.pumpkin_ref }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${REQUESTED_REF}" ]]; then
            ref="${REQUESTED_REF}"
          else
            ref="$(gh api repos/Pumpkin-MC/Pumpkin/releases --paginate --jq '.[0].tag_name' | head -n1)"
            if [[ -z "${ref}" || "${ref}" == "null" ]]; then
              echo "::error::Could not resolve the latest Pumpkin release."
              exit 1
            fi
          fi
          echo "ref=${ref}" >> "${GITHUB_OUTPUT}"
          echo "Building Pumpkin ref: ${ref}"

      - name: Checkout Pumpkin source
        uses: actions/checkout@v4
        with:
          repository: Pumpkin-MC/Pumpkin
          ref: ${{ steps.resolve.outputs.ref }}
          path: Pumpkin
          submodules: recursive
          fetch-depth: 0

      - name: Install Rust toolchain and Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Configure Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK and NDK
        uses: android-actions/setup-android@v3

      - name: Install pinned Android NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/28.2.13676358" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/28.2.13676358" >> "${GITHUB_ENV}"

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: Pumpkin -> target

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Pumpkin for all Android ABIs
        working-directory: Pumpkin
        env:
          CARGO_BUILD_JOBS: "2"
        shell: bash
        run: |
          set -uo pipefail

          # Remove old outputs first so a failed compile cannot pass verification
          # by accidentally reusing a binary from a previous run.
          rm -f target/aarch64-linux-android/release/pumpkin
          rm -f target/armv7-linux-androideabi/release/pumpkin
          rm -f target/x86_64-linux-android/release/pumpkin

          # Pumpkin currently builds an executable rather than a cdylib.
          # cargo-ndk may return non-zero during its final .so-copy phase even
          # after Cargo successfully produced all target executables. Verify
          # the actual target outputs and their ELF architectures below.
          cargo ndk \
            -t arm64-v8a \
            -t armeabi-v7a \
            -t x86_64 \
            --platform 26 \
            -o ./android-build \
            build --release -p pumpkin
          cargo_status=$?

          targets=(
            "aarch64-linux-android:AArch64"
            "armv7-linux-androideabi:ARM"
            "x86_64-linux-android:X86-64"
          )

          for entry in "${targets[@]}"; do
            target="${entry%%:*}"
            expected="${entry#*:}"
            binary="target/${target}/release/pumpkin"

            if [[ ! -s "${binary}" ]]; then
              echo "::error::Missing Pumpkin executable for ${target}; cargo-ndk exit code: ${cargo_status}"
              exit 1
            fi

            actual="$(readelf -h "${binary}" | awk -F: '/Machine:/ {gsub(/^[ \t]+/, "", $2); print $2}')"
            if [[ "${actual}" != *"${expected}"* ]]; then
              echo "::error::Wrong ELF architecture for ${target}: ${actual}"
              exit 1
            fi
            echo "Verified ${target}: ${actual} ($(du -h "${binary}" | cut -f1))"
          done

          if [[ "${cargo_status}" -ne 0 ]]; then
            echo "::warning::cargo-ndk returned ${cargo_status}, but all three freshly-built executables passed ELF verification. This is the documented executable-vs-cdylib post-processing quirk."
          fi

      - name: Stage native executables as Android libraries
        shell: bash
        run: |
          set -euo pipefail
          root="app/src/main/jniLibs"
          install -D "Pumpkin/target/aarch64-linux-android/release/pumpkin" "${root}/arm64-v8a/libpumpkin.so"
          install -D "Pumpkin/target/armv7-linux-androideabi/release/pumpkin" "${root}/armeabi-v7a/libpumpkin.so"
          install -D "Pumpkin/target/x86_64-linux-android/release/pumpkin" "${root}/x86_64/libpumpkin.so"
          find "${root}" -type f -name libpumpkin.so -exec ls -lh {} \;

      - name: Upload Pumpkin native binaries
        uses: actions/upload-artifact@v4
        with:
          name: pumpkin-native-${{ github.run_id }}
          path: app/src/main/jniLibs/
          if-no-files-found: error
          retention-days: 7

  build-apk:
    name: Build Android APK
    runs-on: ubuntu-24.04
    needs: build-pumpkin
    steps:
      - name: Checkout launcher
        uses: actions/checkout@v4

      - name: Download Pumpkin native binaries
        uses: actions/download-artifact@v4
        with:
          name: pumpkin-native-${{ github.run_id }}
          path: app/src/main/jniLibs/

      - name: Configure Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK contains all Pumpkin architectures
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "${apk}"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            unzip -Z1 "${apk}" | grep -Fx "lib/${abi}/libpumpkin.so" >/dev/null || {
              echo "::error::APK is missing libpumpkin.so for ${abi}"
              exit 1
            }
          done
          echo "APK verified: ${apk}"
          sha256sum "${apk}"

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PumpkinLauncher-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
