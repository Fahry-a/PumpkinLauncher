name: Auto Tag from Changelog

run-name: Auto tag ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - CHANGELOG.md
      - VERSION

permissions:
  contents: write
  actions: write

concurrency:
  group: auto-tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    name: Compare versions and tag
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout launcher
        uses: actions/checkout@v4

      - name: Compare CHANGELOG with VERSION
        id: compare
        shell: bash
        run: |
          set -euo pipefail

          changelog_version="$(grep -m1 -E '^## \[[0-9]' CHANGELOG.md | sed -E 's/^## \[([^]]+)\].*/\1/' || true)"
          file_version="$(tr -d '[:space:]' < VERSION)"

          if [[ -z "${changelog_version}" ]]; then
            echo "::error::CHANGELOG.md has no top release section like '## [1.2.3] - YYYY-MM-DD'."
            exit 1
          fi
          if [[ -z "${file_version}" ]]; then
            echo "::error::VERSION is empty."
            exit 1
          fi
          if [[ "${changelog_version}" != "${file_version}" ]]; then
            echo "::error::Versions differ: CHANGELOG.md has '${changelog_version}' but VERSION has '${file_version}'. Align them to create a tag."
            exit 1
          fi
          # The release workflow must find notes for this exact version.
          if ! grep -q -E "^## \[${file_version}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for ${file_version}."
            exit 1
          fi
          if [[ ! "${file_version}" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'${file_version}' is not a valid release version (expected 1.2.3)."
            exit 1
          fi

          tag="v${file_version}"
          echo "version=${file_version}" >> "${GITHUB_OUTPUT}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" > /dev/null 2>&1; then
            echo "Tag ${tag} already exists; nothing to do."
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "Tag ${tag} will be created."
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Push tag and start the release workflow
        if: steps.compare.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.compare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "PumpkinLauncher ${VERSION}"
          git push origin "v${VERSION}"
          # Events triggered by GITHUB_TOKEN do not start other workflows, so
          # the release is dispatched explicitly instead of relying on the tag push.
          gh workflow run releases.yml --ref "v${VERSION}"
